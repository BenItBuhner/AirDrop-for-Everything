[package]
name = "a4e"
description = "a4e — AirDrop for every platform (CLI)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "a4e"
path = "src/main.rs"

[dependencies]
airdrop-core = { path = "../core" }
clap = { version = "4", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
anyhow = "1"
hostname = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
