[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "airdrop-everything"
version = "0.1.0"
description = "AirDrop protocol reimplementation for every platform: send and receive over AWDL (macOS/Linux+OWL) or plain LAN"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
keywords = ["airdrop", "awdl", "apple", "mdns", "file-transfer", "owl", "bonjour"]
authors = [{name = "AirDrop-for-Everything contributors"}]
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Communications :: File Sharing",
    "Topic :: System :: Networking",
]
dependencies = [
    "zeroconf>=0.90",
]

[project.urls]
Homepage = "https://github.com/BenItBuhner/AirDrop-for-Everything"
Repository = "https://github.com/BenItBuhner/AirDrop-for-Everything"
Issues = "https://github.com/BenItBuhner/AirDrop-for-Everything/issues"

[project.optional-dependencies]
icons = ["Pillow>=9"]
certs = ["cryptography>=41"]
ifaces = ["psutil>=5.9", "ifaddr>=0.2"]
ble-linux = ["dbus-python>=1.3", "PyGObject>=3.42"]
ble-windows = ["winsdk>=1.0"]
all = [
    "Pillow>=9", "cryptography>=41", "psutil>=5.9", "ifaddr>=0.2",
]
test = ["pytest>=7"]

[project.scripts]
airdrop-everything = "airdrop_everything.cli:main"
a4e = "airdrop_everything.cli:main"
radio-owl = "airdrop_everything.radio_owl:main"

[tool.setuptools]
packages = ["airdrop_everything"]

[tool.setuptools.package-data]
airdrop_everything = ["certs/*.pem", "owl-profiles"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM", "RUF", "S", "PLW", "ISC"]
ignore = [
    "BLE001",   # cleanup paths deliberately swallow all errors
    "PLW1510",  # probe subprocesses don't need check=
    "S110",     # try/except/pass is intentional for best-effort cleanup
    "S101",     # tests use assert
    "E501",     # long lines are fine (docs strings, constants)
    "S603",     # we only ever exec fixed system tools (iw, openssl, hcitool)
    "S607",     # and PATH lookup is the point on Linux/macOS
    "S104",     # binding all interfaces is the server's job on LAN
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "S101"]
"airdrop_everything/radio_owl.py" = ["S603", "S607"]  # shells out to iw/owl by design
